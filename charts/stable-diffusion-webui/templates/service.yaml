apiVersion: v1
kind: Service
metadata:
  name: {{ include "stable-diffusion-webui.fullname" . }}
  labels:
    {{- include "stable-diffusion-webui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: ui
  selector:
    {{- include "stable-diffusion-webui.selectorLabels" . | nindent 4 }}
